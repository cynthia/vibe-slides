<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1030">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#202124" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="key" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="undo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbbc04"/>
      <stop offset="1" stop-color="#34a853"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="1030" rx="54" fill="#f8fafd"/>
  <path d="M122 770 C245 710 351 808 474 740 C627 655 721 786 858 704 C1012 612 1105 686 1192 636" fill="none" stroke="#dadce0" stroke-width="16" stroke-linecap="round" opacity="0.9"/>

  <g filter="url(#shadow)">
    <rect x="170" y="210" width="310" height="260" rx="42" fill="url(#key)" stroke="#4285f4" stroke-width="10"/>
    <rect x="520" y="210" width="250" height="260" rx="42" fill="url(#key)" stroke="#4285f4" stroke-width="10"/>
    <text x="325" y="366" text-anchor="middle" font-family="Google Sans, Arial, sans-serif" font-size="86" font-weight="800" fill="#202124">Ctrl</text>
    <text x="645" y="370" text-anchor="middle" font-family="Google Sans, Arial, sans-serif" font-size="112" font-weight="900" fill="#202124">Z</text>
    <text x="500" y="366" text-anchor="middle" font-family="Google Sans, Arial, sans-serif" font-size="82" font-weight="800" fill="#5f6368">+</text>
  </g>

  <g transform="translate(845 245)">
    <path d="M88 74 h156 c44 0 80 36 80 80 v0 c0 44 -36 80 -80 80 H88" fill="none" stroke="#34a853" stroke-width="34" stroke-linecap="round"/>
    <path d="M106 26 L36 88 L106 150" fill="none" stroke="#34a853" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="610" width="820" height="230" rx="52" fill="url(#undo)" stroke="#202124" stroke-width="10"/>
    <text x="640" y="756" text-anchor="middle" font-family="Google Sans, Arial, sans-serif" font-size="96" font-weight="900" fill="#202124">UNDO</text>
  </g>

  <text x="640" y="930" text-anchor="middle" font-family="Google Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#5f6368">safe experiments need a real back button</text>
</svg>
